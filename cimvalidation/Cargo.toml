[package]
name = "cimoxide-validation"
description = "SHACL validation of CGMES datasets against the ENTSO-E profile constraints"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*.rs", "Cargo.toml"]

[lib]
name = "cimvalidation"

[features]
default = []
# Load a bag family's shape table from SHACL TTL at runtime. Off by default:
# it pulls a TTL parser and an RDFS import, which the crates depending on
# cimvalidation for its types have no use for.
#
# Enables cimstructs' dynamic-schema too, because the shapes resolve against
# the class table: a shape table built from one release and a class table from
# another would disagree about what a class is.
dynamic-shapes = ["dep:cimoxide-schema", "cimoxide-structs/dynamic-schema"]
# The generated per-check validators the CGMES shape table replaced (~250k
# lines). Off by default; on only to compare the two (examples/cgmes_ab.rs).
# Needs `make generate` to have written cimvalidation/src/generated_*.rs.
generated-validators = []

[dependencies]
cimoxide-structs = { workspace = true }
cimoxide-decoder = { workspace = true }
cimoxide-schema = { workspace = true, optional = true }
regex       = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# The shape-load bench measures the parser directly, so it needs the crate even
# when the feature that would pull it in is off.
cimoxide-schema = { workspace = true }

[[bench]]
name = "nc_validate"
harness = false

[[bench]]
name = "shape_load"
harness = false

[[example]]
name = "cgmes_ab"
required-features = ["dynamic-shapes", "generated-validators"]
