[package]
name = "cimoxide-gen"
description = "Code generator turning ENTSO-E CGMES RDF/SHACL schemas into typed Rust structs and SHACL validators"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["development-tools", "science"]

[[bin]]
name = "cimgen"
path = "src/main.rs"

[dependencies]
quick-xml = { version = "0.37", features = ["encoding"] }
glob = "0.3"
syn = { version = "2", features = ["full"] }
proc-macro2 = "1"

[dev-dependencies]
sha2 = "0.11"
