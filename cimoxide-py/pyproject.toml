[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "cimoxide"
version = "0.3.1"
description = "Python bindings for the cimoxide CGMES parser"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/m-mirz/cimoxide"
Issues = "https://github.com/m-mirz/cimoxide/issues"

[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module"]
