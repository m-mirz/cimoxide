[package]
name = "cimoxide-py"
version = "0.2.0"
edition = "2024"
include = ["src/**/*.rs", "python/**/*", "Cargo.toml"]

[lib]
name = "cimoxide"
crate-type = ["cdylib"]

[dependencies]
cimdecoder    = { path = "../cimdecoder" }
cimstructs    = { path = "../cimstructs" }
cimvalidation = { path = "../cimvalidation" }
cimconvert    = { path = "../cimconvert" }
cimsparql     = { path = "../cimsparql", optional = true }
pyo3          = { version = "0.25", features = ["extension-module", "abi3-py39"] }
pythonize     = "0.25"
serde_json    = "1"

[features]
# On by default: the wheel is an end-user artifact.
default = ["sparql"]
sparql = ["dep:cimsparql"]
