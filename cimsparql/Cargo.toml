[package]
name = "cimsparql"
version = "0.2.0"
edition = "2024"

[dependencies]
cimstructs = { path = "../cimstructs" }
cimdecoder = { path = "../cimdecoder" }
# `default-features = false` is load-bearing: oxigraph's default feature is `rocksdb`,
# which pulls in oxrocksdb-sys and a C++ toolchain. Disabled, oxigraph is pure Rust and
# `Store::new()` is the in-memory store.
oxigraph = { version = "0.5", default-features = false }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "materialize"
harness = false
