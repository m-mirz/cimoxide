[package]
name = "cimoxide-sparql"
description = "SPARQL 1.1 querying over decoded CGMES datasets via an in-memory oxigraph store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["science", "database"]

[lib]
name = "cimsparql"

[dependencies]
cimoxide-structs = { workspace = true }
cimoxide-decoder = { workspace = true }
# `default-features = false` is load-bearing: oxigraph's default feature is `rocksdb`,
# which pulls in oxrocksdb-sys and a C++ toolchain. Disabled, oxigraph is pure Rust and
# `Store::new()` is the in-memory store.
oxigraph = { version = "0.5", default-features = false }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "materialize"
harness = false
