[package]
name = "cimoxide-structs"
description = "Generated Rust structs for the IEC 61970/61968 Common Information Model as profiled by ENTSO-E CGMES"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*.rs", "Cargo.toml"]

[lib]
name = "cimstructs"

[features]
default = []
# Load a bag family's class table from RDFS at runtime. Off by default: it
# pulls an XML parser, and the six crates that depend on cimstructs for its
# types have no use for one.
dynamic-schema = ["dep:cimoxide-schema"]

[dependencies]
cimoxide-schema = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
