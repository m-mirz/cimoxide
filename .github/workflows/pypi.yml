name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Generate cimmodel and Python stubs
        run: make generate

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: cimoxide-py
          args: --release --out ../dist
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Generate cimmodel and Python stubs
        run: make generate

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: cimoxide-py
          args: --release --out ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Generate cimmodel and Python stubs
        run: make generate

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: cimoxide-py
          args: --release --out ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate cimmodel and Python stubs
        run: make generate

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: cimoxide-py
          args: --out ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # cimoxide-mcp: the `cimmcp` binary as a wheel (maturin `bindings = "bin"`), so MCP
  # clients can start it with `uvx --from cimoxide-mcp cimmcp`. Wheels only — an sdist
  # would need the generated tables — and for Linux x86_64 only, to keep the release
  # short: Windows and macOS get `cimmcp` from crates.io and the VS Code extension.
  mcp:
    name: cimoxide-mcp linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mcp-x86_64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mcp-x86_64-

      - name: Generate cimmodel and cimvalidation
        run: make generate

      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          working-directory: cimoxide-mcp
          args: --release --out ../dist
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-mcp-linux-x86_64
          path: dist

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos, sdist, mcp]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
