name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: cimcli
            artifact: cimcli-linux-amd64
            lsp_binary: cimlsp
            lsp_artifact: cimlsp-linux-amd64
            mcp_binary: cimmcp
            mcp_artifact: cimmcp-linux-amd64
          - os: windows-latest
            binary: cimcli.exe
            artifact: cimcli-windows-amd64.exe
            lsp_binary: cimlsp.exe
            lsp_artifact: cimlsp-windows-amd64.exe
            mcp_binary: cimmcp.exe
            mcp_artifact: cimmcp-windows-amd64.exe
          - os: macos-latest
            binary: cimcli
            artifact: cimcli-darwin-arm64
            lsp_binary: cimlsp
            lsp_artifact: cimlsp-darwin-arm64
            mcp_binary: cimmcp
            mcp_artifact: cimmcp-darwin-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Generate cimmodel and cimvalidation
        run: make generate

      - name: Build
        run: cargo build --release -p cimoxide-cli -p cimoxide-lsp -p cimoxide-mcp

      - name: Stage artifact
        shell: bash
        run: |
          cp target/release/${{ matrix.binary }} ${{ matrix.artifact }}
          cp target/release/${{ matrix.lsp_binary }} ${{ matrix.lsp_artifact }}
          cp target/release/${{ matrix.mcp_binary }} ${{ matrix.mcp_artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.lsp_artifact }}
            ${{ matrix.mcp_artifact }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            --repo ${{ github.repository }} \
            cimcli-linux-amd64 \
            cimcli-windows-amd64.exe \
            cimcli-darwin-arm64 \
            cimlsp-linux-amd64 \
            cimlsp-windows-amd64.exe \
            cimlsp-darwin-arm64 \
            cimmcp-linux-amd64 \
            cimmcp-windows-amd64.exe \
            cimmcp-darwin-arm64
