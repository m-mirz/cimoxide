name: VS Code extension

# One VSIX per platform, each bundling its own `cimlsp`, published to the
# Visual Studio Marketplace. Needs VSCE_PAT (Azure DevOps token with
# Marketplace › Manage) in the `vscode-release` environment.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the packages (otherwise only build them)'
        type: boolean
        default: false

jobs:
  package:
    name: Package ${{ matrix.vsce_target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # musl: a static binary runs on any Linux distribution.
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            vsce_target: linux-x64
            exe: cimlsp
          - os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            vsce_target: linux-arm64
            exe: cimlsp
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            vsce_target: win32-x64
            exe: cimlsp.exe
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            vsce_target: darwin-arm64
            exe: cimlsp
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            vsce_target: darwin-x64
            exe: cimlsp

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install musl tools
        if: contains(matrix.rust_target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust_target }}-cargo-vscode-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust_target }}-cargo-vscode-

      - name: Generate cimmodel and cimvalidation
        run: make generate

      - name: Build cimlsp
        run: cargo build --release -p cimoxide-lsp --target ${{ matrix.rust_target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check extension version matches the workspace
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ext=$(node -p "require('./editors/vscode/package.json').version")
          if [ "$crate" != "$ext" ]; then
            echo "editors/vscode/package.json is $ext, the workspace is $crate" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        working-directory: editors/vscode
        run: |
          mkdir -p server
          cp ../../target/${{ matrix.rust_target }}/release/${{ matrix.exe }} server/
          npm ci
          npx vsce package --target ${{ matrix.vsce_target }}

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsce_target }}
          path: editors/vscode/*.vsix

  publish:
    name: Publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    environment: vscode-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3 publish --packagePath *.vsix
