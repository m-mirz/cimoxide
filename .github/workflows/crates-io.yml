name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and verify everything without uploading'
        type: boolean
        default: true

jobs:
  publish:
    name: Publish workspace crates
    runs-on: ubuntu-latest
    environment: crates-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      # cimstructs/src/*.rs and cimvalidation/src/generated_*.rs are gitignored, so
      # they have to be regenerated before packaging (and packaged via --allow-dirty).
      - name: Generate cimstructs and cimvalidation
        run: make generate

      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cimoxide-cli") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

      - name: Dry-run publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: ./scripts/publish-workspace.sh --dry-run

      # The script wraps `cargo publish --workspace` (which resolves the inter-crate
      # order and waits for the index itself) with two things crates.io makes
      # necessary: it excludes versions already on the registry, so a run that stalled
      # part-way can simply be re-run, and it sleeps through the publish rate limit
      # instead of failing on it. See scripts/publish-workspace.sh for the limits.
      - name: Publish
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        timeout-minutes: 180
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-workspace.sh
