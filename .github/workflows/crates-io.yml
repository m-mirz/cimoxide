name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and verify everything without uploading'
        type: boolean
        default: true

jobs:
  publish:
    name: Publish workspace crates
    runs-on: ubuntu-latest
    environment: crates-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      # cimstructs/src/*.rs and cimvalidation/src/generated_*.rs are gitignored, so
      # they have to be regenerated before packaging (and packaged via --allow-dirty).
      - name: Generate cimstructs and cimvalidation
        run: make generate

      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cimoxide-cli") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

      - name: Dry-run publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: cargo publish --workspace --dry-run --allow-dirty

      # `--workspace` resolves the inter-crate dependency order itself and waits for
      # each upload to appear in the index before publishing its dependents. If a run
      # fails part-way, re-run with `--exclude <crate>` for whatever already landed —
      # crates.io rejects a re-upload of an existing version.
      - name: Publish
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --allow-dirty
