[package]
name = "cimoxide-lsp"
description = "cimlsp: language server for ENTSO-E CGMES and NC RDF/XML — SHACL validation as diagnostics, hover, go to definition"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["development-tools", "science"]

[[bin]]
name = "cimlsp"
path = "src/main.rs"

[dependencies]
cimoxide-model      = { workspace = true, features = ["dynamic-schema"] }
cimoxide-validation = { workspace = true, features = ["dynamic-shapes"] }
quick-xml  = "0.37"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-server = "0.7"
lsp-types  = "0.95"
crossbeam-channel = "0.5"
