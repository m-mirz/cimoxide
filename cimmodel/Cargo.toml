[package]
name = "cimoxide-model"
description = "The IEC 61970/61968 Common Information Model as profiled by ENTSO-E CGMES: generated Rust structs, a streaming RDF/XML decoder, and conversion to RDF/XML and JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*.rs", "Cargo.toml"]

[lib]
name = "cimmodel"

[features]
default = []
# Load a bag family's class table from RDFS at runtime. Off by default: it
# pulls the RDFS importer, and the crates that depend on cimmodel for its
# types have no use for one.
dynamic-schema = ["dep:cimoxide-schema"]

[dependencies]
cimoxide-schema = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml  = { version = "0.37", features = ["encoding"] }
sha1       = "0.11"   # deterministic (v5) UUIDs for synthesized FullModel headers

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "schema_load"
harness = false

[[bench]]
name = "real_grid"
harness = false

[[bench]]
name = "nc_decode"
harness = false
required-features = ["dynamic-schema"]
