[package]
name = "cimoxide-view"
description = "A CGMES or NC model set as views: its grid at substation level, laid out, and its objects as a tree, with validation findings on each"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*.rs", "Cargo.toml"]

[lib]
name = "cimview"

[dependencies]
cimoxide-model = { workspace = true }
cimoxide-validation = { workspace = true }
serde_json = "1"
