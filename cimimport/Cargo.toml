[package]
name = "cimoxide-import"
description = "Importers from other power-grid formats (MATPOWER) into CGMES 3.0: EQ, SSH, TP and SV"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*.rs", "Cargo.toml"]

[lib]
name = "cimimport"

[dependencies]
cimoxide-model = { workspace = true }
sha1 = "0.11"   # deterministic (v5) UUIDs, so a case converts to the same mRIDs every time

[dev-dependencies]
cimoxide-validation = { workspace = true }
